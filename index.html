<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>JC Tilak Prasad Lamichhane – Pokhara Jaycees</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1220;--bg2:#121b2e;--card:#162036;--text:#eef1f7;--muted:#9aa6bd;--gold:#e0b45a;--gold2:#f6dc9b;--line:rgba(224,180,90,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
.ne{font-family:'Noto Sans Devanagari',Inter,sans-serif}
.serif{font-family:'Playfair Display',Georgia,serif}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
/* hero */
.hero{position:relative;padding:36px 0 56px;text-align:center;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#1d2b4a 0%,var(--bg) 70%)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 9s ease-in-out infinite}
.o1{width:220px;height:220px;background:#3a5bd9;top:-40px;left:-70px}
.o2{width:200px;height:200px;background:var(--gold);top:280px;right:-90px;animation-delay:-4s;opacity:.22}
@keyframes float{50%{transform:translate(20px,30px) scale(1.12)}}
.badge{display:inline-block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line);padding:6px 14px;border-radius:99px;background:rgba(224,180,90,.07)}
.frame{position:relative;width:min(70vw,280px);margin:56px auto 0;will-change:transform,opacity;transform:translateY(calc(var(--sy,0)*-.08px)) scale(calc(1 - var(--sy,0)*.0003));opacity:calc(1 - var(--sy,0)*.0012)}
.frame:before{content:"";position:absolute;inset:-28px;border-radius:50%;border:1px dashed rgba(224,180,90,.5);animation:spin 26s linear infinite reverse}
.frame:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:ripple 3.2s ease-out infinite}
@keyframes ripple{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(1.4)}}
.ring{position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),transparent 30%,var(--gold2) 55%,transparent 80%,var(--gold));animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.photo{position:relative;display:block;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 8%;border-radius:50%;border:4px solid var(--bg);animation:pop 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(20px)}}
.pin{z-index:2;position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;font-weight:600;font-size:12px;padding:8px 18px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
h1{font-size:clamp(28px,8.5vw,40px);line-height:1.15;margin-top:64px;animation:up .9s .3s both}
.role{color:var(--muted);font-size:14px;margin-top:6px;animation:up .9s .45s both}
.tag{margin-top:18px;font-size:18px;color:var(--gold2);animation:up .9s .6s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.scroll{margin-top:30px;display:inline-flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12px;text-decoration:none;animation:up 1s .9s both}
.scroll i{width:22px;height:36px;border:2px solid var(--muted);border-radius:12px;position:relative}
.scroll i:after{content:"";position:absolute;left:50%;top:6px;width:4px;height:7px;margin-left:-2px;background:var(--gold);border-radius:3px;animation:dot 1.6s infinite}
@keyframes dot{60%{transform:translateY(12px);opacity:0}}
/* sections */
section{padding:56px 0}
.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
h2{font-size:clamp(26px,7.5vw,34px);text-align:center;line-height:1.2;margin:10px 0 8px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:32px}
.rule{width:56px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));margin:14px auto 0}
.rv{opacity:0;transform:translateY(34px);filter:blur(8px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .8s ease}
.rv.l{transform:translateX(-44px)}
.rv.r{transform:translateX(44px)}
.rv.z{transform:scale(.88) translateY(20px)}
.rv.in{opacity:1;transform:none;filter:none}
.rv .rule{width:0;transition:width .9s .35s ease}
.rv.in .rule{width:56px}
.rv.in .ico{animation:bob .7s .4s both}
@keyframes bob{40%{transform:scale(1.25) rotate(-8deg)}}
.pill{display:block;width:100%;text-align:left;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;color:inherit;font:inherit;cursor:pointer;position:relative;overflow:hidden;transition:transform .25s,border-color .25s}
.pill:active{transform:scale(.98)}
.pill.open{border-color:var(--gold)}
.pill:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--gold),var(--gold2))}
.row{display:flex;align-items:center;gap:14px}
.num{font-family:'Playfair Display',serif;font-size:30px;color:rgba(224,180,90,.45);min-width:40px}
.ico{font-size:26px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(224,180,90,.1);flex:none}
.pill h3{font-size:17px;font-weight:600;line-height:1.25}
.pill p{font-size:13.5px;color:var(--muted);margin-top:2px}
.chev{margin-left:auto;color:var(--gold);transition:transform .3s;font-size:18px}
.open .chev{transform:rotate(180deg)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.more ul{list-style:none;padding:14px 0 2px 2px}
.more li{font-size:14px;color:#cdd5e5;padding:6px 0 6px 20px;position:relative}
.more li:before{content:"";position:absolute;left:2px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
/* values */
.vals{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
.chip{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;animation:glow 4s ease-in-out infinite}
.chip small{display:block;color:var(--muted);font-size:11px;text-align:center}
@keyframes glow{50%{box-shadow:0 0 18px rgba(224,180,90,.25)}}
/* story sections */
.lead{font-size:18px;line-height:2;border-left:3px solid var(--gold);padding-left:16px}
.para{font-size:15.5px;line-height:2;color:#cdd5e5;margin-top:18px}
.call{margin-top:24px;padding:18px;border-radius:18px;background:rgba(224,180,90,.08);border:1px solid var(--line);color:var(--gold2);font-size:16px;line-height:1.9;text-align:center}
.tl{position:relative;margin-top:28px;padding-left:30px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),transparent)}
.step{position:relative;margin-bottom:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.step:before{content:"";position:absolute;left:-29px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(224,180,90,.2)}
.step small{display:block;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-bottom:6px}
.step p{font-size:15px;line-height:1.95;color:#cdd5e5}
.vis{text-align:center;background:radial-gradient(90% 60% at 50% 0%,rgba(224,180,90,.16),transparent 70%)}
.vh{font-size:clamp(22px,6.4vw,28px);line-height:1.6;font-weight:600;margin:6px 0 20px;background:linear-gradient(120deg,var(--gold),var(--gold2),var(--gold));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% center}}
/* message */
.quote{background:linear-gradient(160deg,#1b2744,var(--bg2));border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;position:relative}
.quote:before{content:"“";position:absolute;top:-6px;left:18px;font:700 80px/1 'Playfair Display',serif;color:var(--gold);opacity:.5}
.quote p{font-size:16px;line-height:1.9;color:#dfe5f2}
.quote strong{display:block;margin-top:16px;color:var(--gold2);font-weight:600}
.sign{margin-top:20px;font-size:14px;color:var(--muted)}
.sign b{display:block;color:var(--text);font-size:17px;font-family:'Playfair Display',serif}
/* footer */
footer{text-align:center;padding:48px 0 110px;border-top:1px solid var(--line);background:linear-gradient(var(--bg),#070b14)}
.final{font-size:24px;line-height:1.3}
.final span{color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:14px 28px;border:0;border-radius:99px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1405;font:600 15px Inter,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(224,180,90,.3);animation:pulse 2.4s infinite;text-decoration:none}
@keyframes pulse{50%{box-shadow:0 10px 40px rgba(224,180,90,.55)}}
.fine{margin-top:22px;font-size:12px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(11,18,32,.88);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;transform:translateY(110%);transition:transform .5s;z-index:20}
.bar.show{transform:none}
.bar span{font-size:13px;line-height:1.3}
.bar span b{display:block;color:var(--gold2)}
.bar .btn{margin:0;padding:10px 20px;font-size:13px;animation:none;box-shadow:none}
.prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:30;width:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.rv.l,.rv.r,.rv.z{opacity:1;transform:none;filter:none}.rv .rule{width:56px}.frame{transform:none;opacity:1}}
</style>
</head>

    "संस्थामा प्राप्त अनुभव, सहकार्यबाट सिकेका पाठ र भविष्यप्रतिको स्पष्ट दृष्टिकोणलाई आधार बनाउँदै पोखरा जेसीजलाई अझ सशक्त, समावेशी, गतिशील र प्रभावशाली संस्था बनाउने मेरो प्रतिबद्धता रहेको छ।",
    "मेरो विश्वास छ – संस्थाको वास्तविक शक्ति कुनै एक व्यक्तिमा होइन, यसका सदस्यहरूको एकता, सक्रियता, क्षमता र सामूहिक प्रयासमा निहित हुन्छ।"
  ],
  close: "आउनुहोस्, अनुभवलाई ऊर्जामा, विचारलाई कार्यमा र नेतृत्वलाई परिणाममा रूपान्तरण गरौँ।"
};
const JOURNEY = [
  ["Learn · Teach · Lead", "पोखरा जेसीज मेरो लागि केवल एउटा संस्था होइन; यो सिक्ने, सिकाउने, नेतृत्व विकास गर्ने, सम्बन्ध विस्तार गर्ने र समाजप्रति जिम्मेवार बन्ने महत्वपूर्ण अवसर हो।"],
  ["Grown Together", "यस संस्थासँगको यात्रामा प्राप्त अनुभव, विभिन्न जिम्मेवारीमा रहेर काम गर्ने अवसर तथा अग्रज र समकालीन साथीहरूसँगको सहकार्यले मेरो नेतृत्व क्षमतालाई थप परिष्कृत बनाएको छ।"],
  ["The Lesson", "मेरो यात्राको प्रत्येक अनुभवले एउटा कुरा सिकाएको छ – संस्थाको विकास निरन्तरता, पारदर्शिता, सहकार्य र प्रतिबद्धताबाट सम्भव हुन्छ।"]
];
const VISION = {
  head: "सशक्त सदस्य, सक्षम नेतृत्व र प्रभावकारी संस्था।",
  text: "पोखरा जेसीजलाई यस्तो संस्थाका रूपमा विकास गर्ने मेरो परिकल्पना छ, जहाँ प्रत्येक सदस्यले आफ्नो क्षमता पहिचान गर्न, नेतृत्व विकास गर्न, नयाँ अवसर प्राप्त गर्न र संस्थाको सफलतामा अर्थपूर्ण योगदान दिन सकून्।"
};
/* ================================================ */

function Reveal({ delay = 0, v = "", children }) {
  const ref = useRef(null);
  const [on, setOn] = useState(false);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setOn(true); io.disconnect(); } }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  return html`<div ref=${ref} class=${"rv " + v + (on ? " in" : "")} style=${{ transitionDelay: delay + "ms" }}>${children}</div>`;
}

function Pillar({ p, i }) {
  const [open, setOpen] = useState(false);
  return html`<${Reveal} v=${i % 2 ? "r" : "l"}>
    <button class=${"pill" + (open ? " open" : "")} onClick=${() => setOpen(!open)} aria-expanded=${open}>
      <div class="row">
        <div class="num">${"0" + (i + 1)}</div>
        <div class="ico">${p.icon}</div>
        <div><h3>${p.title}</h3><p>${p.desc}</p></div>
        <div class="chev">⌄</div>
      </div>
      <div class="more"><div><ul class="ne">${p.pts.map(t => html`<li key=${t}>${t}</li>`)}</ul></div></div>
    </button><//>`;
}

async function share() {
  const url = location.href.split("#")[0];
  try {
    if (navigator.share) await navigator.share({ title: CANDIDATE.name, text: CANDIDATE.shareText, url });
    else window.open("https://wa.me/?text=" + encodeURIComponent(CANDIDATE.shareText + " " + url), "_blank");
  } catch (e) {}
}

function App() {
  const [bar, setBar] = useState(false);
  const progRef = useRef(null);
  useEffect(() => {
    const f = () => {
      const h = document.documentElement.scrollHeight - innerHeight;
      progRef.current.style.width = (scrollY / h * 100) + "%";
      if (scrollY < 1000) document.documentElement.style.setProperty("--sy", scrollY);
      setBar(scrollY > innerHeight * 0.9);
    };
    addEventListener("scroll", f, { passive: true });
    return () => removeEventListener("scroll", f);
  }, []);

  return html`<main>
    <div class="prog" ref=${progRef}></div>
    <header class="hero">
      <div class="orb o1"></div><div class="orb o2"></div>
      <div class="wrap">
        <span class="badge">A Proposed Presidential Roadmap</span>
        <div class="frame">
          <div class="ring"></div>
          <img class="photo" src=${CANDIDATE.photo} alt=${CANDIDATE.name} />
          <div class="pin">Pokhara Jaycees</div>
        </div>
        <h1 class="serif">${CANDIDATE.name}</h1>
        <div class="role">${CANDIDATE.role}</div>
        <div class="tag ne">${CANDIDATE.tagline}</div>
        <a class="scroll" href="#intro"><i></i>Explore the roadmap</a>
      </div>
    </header>

    <section id="intro"><div class="wrap">
      <${Reveal}>
        <div class="eyebrow">Introduction | परिचय</div>
        <h2 class="serif">Leadership is responsibility</h2>
        <div class="rule"></div>
      <//>
      <${Reveal}><p class="lead ne" style=${{ marginTop: 28 }}>${INTRO.lead}</p><//>
      ${INTRO.body.map(t => html`<${Reveal} key=${t.slice(0, 12)}><p class="para ne">${t}</p><//>`)}
      <${Reveal}><div class="call ne">${INTRO.close}</div><//>
    </div></section>

    <section style=${{ background: "var(--bg2)" }}><div class="wrap">
      <${Reveal}>
        <div class="eyebrow">My Journey | मेरो जेसीज यात्रा</div>
        <h2 class="serif">More than an organisation</h2>
        <div class="rule"></div>
      <//>
      <div class="tl">
        ${JOURNEY.map(([k, t], i) => html`<${Reveal} key=${k} v="r" delay=${i * 90}><div class="step"><small>${k}</small><p class="ne">${t}</p></div><//>`)}
      </div>
    </div></section>

    <section class="vis"><div class="wrap">
      <${Reveal}>
        <div class="eyebrow">My Vision | मेरो परिकल्पना</div>
        <h2 class="serif">Where we are headed</h2>
        <div class="rule" style=${{ marginBottom: 26 }}></div>
        <div class="vh ne">${VISION.head}</div>
        <p class="para ne" style=${{ marginTop: 0 }}>${VISION.text}</p>
      <//>
    </div></section>

    <section id="pillars"><div class="wrap">
      <${Reveal}>
        <div class="eyebrow">A Proposed Presidential Roadmap</div>
        <h2 class="serif">The 6 Pillars of Transformation</h2>
        <div class="rule"></div>
        <p class="sub" style=${{ marginTop: 14 }}>Tap each pillar to explore</p>
      <//>
      ${PILLARS.map((p, i) => html`<${Pillar} key=${p.title} p=${p} i=${i} />`)}
    </div></section>

    <section style=${{ background: "var(--bg2)" }}><div class="wrap">
      <${Reveal}>
        <div class="eyebrow">Leadership Philosophy</div>
        <h2 class="serif">Built on shared values</h2>
        <div class="vals">${VALUES.map(([ne, en], i) => html`<div class="chip" key=${en} style=${{ animationDelay: i * 0.5 + "s" }}><span class="ne">${ne}</span><small>${en}</small></div>`)}</div>
      <//>
    </div></section>

    <section><div class="wrap">
      <${Reveal} v="z">
        <div class="quote ne">
          <p>${MESSAGE}</p>
          <strong>${MESSAGE_CLOSE}</strong>
          <div class="sign">सादर,<b>${CANDIDATE.name}</b>Candidate for President</div>
        </div>
      <//>
    </div></section>

    <footer><div class="wrap">
      <${Reveal} v="z">
        <div class="final serif">Together, We Lead.<br/><span>Together, We Grow.</span></div>
        <button class="btn" onClick=${share}>Share this vision →</button>
        <div class="fine">Your thoughts and suggestions shape this journey.</div>
      <//>
    </div></footer>

    <div class=${"bar" + (bar ? " show" : "")}>
      <span><b>${CANDIDATE.name.replace("JC ", "")}</b>Together, We Lead.</span>
      <button class="btn" onClick=${share}>Share</button>
    </div>
  </main>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
